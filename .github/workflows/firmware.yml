#
# Builds the firmware on pushes and pull requests. A push to main publishes a
# GitHub release when PROJECT_VER does not have a release yet.

name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (ESP-IDF v6.0.1, esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid or missing PROJECT_VER in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version"

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o merged.bin

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist "$RUNNER_TEMP/release-package"

          cp build/EBCTester.bin "dist/EBCTester-${v}.bin"
          cp build/merged.bin "dist/EBCTester-${v}-full-install.bin"

          cmake \
            "-DPROJECT_SOURCE_DIR=$GITHUB_WORKSPACE" \
            "-DOTA_SUITE_DIR=$GITHUB_WORKSPACE/external/ota-suite" \
            "-DSD_CARD_MANAGER_DIR=$GITHUB_WORKSPACE/external/sd-card-manager" \
            "-DDESTINATION_DIR=$RUNNER_TEMP/release-package" \
            "-DFIRMWARE_VERSION=$v" \
            -P cmake/copy_license_bundle.cmake

          python - "$RUNNER_TEMP/release-package/licenses/EBCTester-${v}" \
            "dist/licenses-EBCTester-${v}.zip" <<'PY'
          import os
          import sys
          import zipfile

          source, archive_path = sys.argv[1:]
          root = os.path.dirname(source)
          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for directory, _, filenames in os.walk(source):
                  for filename in filenames:
                      path = os.path.join(directory, filename)
                      archive.write(path, os.path.relpath(path, root))
          PY

          image="dist/EBCTester-${v}.bin"
          size=$(stat -c '%s' "$image")
          sha256=$(sha256sum "$image" | cut -d ' ' -f 1)
          cat > dist/firmware.json <<EOF
          {
            "project": "EBCTester",
            "target": "esp32s3",
            "version": "$v",
            "url": "https://ebctester.gemelon.de/EBCTester-${v}.bin",
            "size": $size,
            "sha256": "$sha256",
            "notes": "Manifest-based update availability; manual installation only."
          }
          EOF

          test -s "dist/EBCTester-${v}.bin"
          test -s "dist/EBCTester-${v}-full-install.bin"
          test -s "dist/firmware.json"
          test -s "dist/licenses-EBCTester-${v}.zip"
          ls -lh dist

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: EBCTester-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check version and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match PROJECT_VER $VERSION"
            exit 1
          fi

          release_error="$RUNNER_TEMP/release-error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>"$release_error"; then
            echo "Release $tag already exists; refusing to overwrite it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -Fq 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

          latest_error="$RUNNER_TEMP/latest-release-error"
          if latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>"$latest_error"); then
            latest_version="${latest_tag#v}"
            newest_version=$(printf '%s\n%s\n' "$latest_version" "$VERSION" | sort -V | tail -n 1)
            if [[ "$newest_version" != "$VERSION" ]]; then
              echo "::error::PROJECT_VER $VERSION is not newer than the latest release $latest_tag"
              exit 1
            fi
          elif ! grep -Fq 'HTTP 404' "$latest_error"; then
            cat "$latest_error" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag_error="$RUNNER_TEMP/tag-error"
            if existing_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>"$tag_error"); then
              if [[ "$existing_tag" != "$GITHUB_SHA" ]]; then
                echo "::error::Tag $tag already points to $existing_tag, not $GITHUB_SHA"
                exit 1
              fi
            elif ! grep -Fq 'HTTP 404' "$tag_error"; then
              cat "$tag_error" >&2
              exit 1
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download release files
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EBCTester-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/EBCTester-${VERSION}.bin" \
            "dist/EBCTester-${VERSION}-full-install.bin" \
            "dist/firmware.json" \
            "dist/licenses-EBCTester-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EBCTester ${VERSION}" \
            --notes "Firmware release ${VERSION}.

          For a complete installation, flash \`EBCTester-${VERSION}-full-install.bin\` at address \`0x0\`. The versioned BIN is for OTA updates. Distribute the accompanying license bundle with the firmware."
