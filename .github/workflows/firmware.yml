#
# Builds the firmware on pushes and pull requests. A push to main publishes a
# GitHub release when PROJECT_VER does not have a release yet.

name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (ESP-IDF v6.0.1, esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid or missing PROJECT_VER in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version"

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o merged.bin

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist "$RUNNER_TEMP/release-package"

          cp build/EBCTester.bin "dist/EBCTester-${v}.bin"
          cp build/merged.bin "dist/EBCTester-${v}-full-install.bin"

          cmake \
            "-DPROJECT_SOURCE_DIR=$GITHUB_WORKSPACE" \
            "-DOTA_SUITE_DIR=$GITHUB_WORKSPACE/external/ota-suite" \
            "-DSD_CARD_MANAGER_DIR=$GITHUB_WORKSPACE/external/sd-card-manager" \
            "-DDESTINATION_DIR=$RUNNER_TEMP/release-package" \
            "-DFIRMWARE_VERSION=$v" \
            -P cmake/copy_license_bundle.cmake

          python - "$RUNNER_TEMP/release-package/licenses/EBCTester-${v}" \
            "dist/licenses-EBCTester-${v}.zip" <<'PY'
          import os
          import sys
          import zipfile

          source, archive_path = sys.argv[1:]
          root = os.path.dirname(source)
          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for directory, _, filenames in os.walk(source):
                  for filename in filenames:
                      path = os.path.join(directory, filename)
                      archive.write(path, os.path.relpath(path, root))
          PY

          image="dist/EBCTester-${v}.bin"
          size=$(stat -c '%s' "$image")
          sha256=$(sha256sum "$image" | cut -d ' ' -f 1)
          cat > dist/firmware.json <<EOF
          {
            "project": "EBCTester",
            "target": "esp32s3",
            "version": "$v",
            "url": "https://ebctester.gemelon.de/EBCTester-${v}.bin",
            "size": $size,
            "sha256": "$sha256",
            "notes": "Manifest-based update availability; manual installation only."
          }
          EOF

          test -s "dist/EBCTester-${v}.bin"
          test -s "dist/EBCTester-${v}-full-install.bin"
          test -s "dist/firmware.json"
          test -s "dist/licenses-EBCTester-${v}.zip"
          ls -lh dist

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: EBCTester-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - name: Check version and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match PROJECT_VER $VERSION"
            exit 1
          fi

          release_error="$RUNNER_TEMP/release-error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>"$release_error"; then
            echo "Release $tag already exists; using its immutable assets."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -Fq 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

          latest_error="$RUNNER_TEMP/latest-release-error"
          if latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>"$latest_error"); then
            latest_version="${latest_tag#v}"
            newest_version=$(printf '%s\n%s\n' "$latest_version" "$VERSION" | sort -V | tail -n 1)
            if [[ "$newest_version" != "$VERSION" ]]; then
              echo "::error::PROJECT_VER $VERSION is not newer than the latest release $latest_tag"
              exit 1
            fi
          elif ! grep -Fq 'HTTP 404' "$latest_error"; then
            cat "$latest_error" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag_error="$RUNNER_TEMP/tag-error"
            if existing_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>"$tag_error"); then
              if [[ "$existing_tag" != "$GITHUB_SHA" ]]; then
                echo "::error::Tag $tag already points to $existing_tag, not $GITHUB_SHA"
                exit 1
              fi
            elif ! grep -Fq 'HTTP 404' "$tag_error"; then
              cat "$tag_error" >&2
              exit 1
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download release files
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EBCTester-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/EBCTester-${VERSION}.bin" \
            "dist/EBCTester-${VERSION}-full-install.bin" \
            "dist/firmware.json" \
            "dist/licenses-EBCTester-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EBCTester ${VERSION}" \
            --notes "Firmware release ${VERSION}.

          For a complete installation, flash \`EBCTester-${VERSION}-full-install.bin\` at address \`0x0\`. The versioned BIN is for OTA updates. Distribute the accompanying license bundle with the firmware."

  publish-ota-server:
    name: Publish public OTA update
    if: needs.release.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Configure SFTP credentials
        env:
          OTA_SFTP_PRIVATE_KEY: ${{ secrets.OTA_SFTP_PRIVATE_KEY }}
          OTA_SFTP_KNOWN_HOSTS: ${{ secrets.OTA_SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OTA_SFTP_PRIVATE_KEY" || { echo "::error::Set the OTA_SFTP_PRIVATE_KEY repository secret"; exit 1; }
          test -n "$OTA_SFTP_KNOWN_HOSTS" || { echo "::error::Set the OTA_SFTP_KNOWN_HOSTS repository secret"; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$OTA_SFTP_PRIVATE_KEY" > "$HOME/.ssh/ota_deploy_key"
          printf '%s\n' "$OTA_SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ota_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Publish OTA image and manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          OTA_SFTP_HOST: ${{ secrets.OTA_SFTP_HOST }}
          OTA_SFTP_USER: ${{ secrets.OTA_SFTP_USER }}
          OTA_SFTP_REMOTE_DIR: ${{ secrets.OTA_SFTP_REMOTE_DIR }}
          OTA_SFTP_PORT: ${{ secrets.OTA_SFTP_PORT }}
        run: |
          set -euo pipefail
          for name in OTA_SFTP_HOST OTA_SFTP_USER OTA_SFTP_REMOTE_DIR; do
            test -n "${!name}" || { echo "::error::Set the $name repository secret"; exit 1; }
          done
          OTA_SFTP_PORT="${OTA_SFTP_PORT:-22}"
          [[ "$OTA_SFTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OTA_SFTP_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$OTA_SFTP_PORT" =~ ^[0-9]+$ ]]
          [[ "$OTA_SFTP_REMOTE_DIR" =~ ^/?[A-Za-z0-9._/-]+$ ]]
          [[ ! "$OTA_SFTP_REMOTE_DIR" =~ (^|/)\.\.?(/|$) ]]
          [[ "$OTA_SFTP_PORT" -ge 1 && "$OTA_SFTP_PORT" -le 65535 ]]

          remote="${OTA_SFTP_REMOTE_DIR%/}"
          mkdir -p dist
          gh release download "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "EBCTester-${VERSION}.bin" \
            --pattern "firmware.json" \
            --pattern "licenses-EBCTester-${VERSION}.zip" \
            --dir dist
          image="dist/EBCTester-${VERSION}.bin"
          package="$RUNNER_TEMP/ota-publication"
          mkdir -p "$package"
          cp "$image" "$package/EBCTester-${VERSION}.bin"
          cp "$image" "$package/EBCTester.bin"
          cp "dist/licenses-EBCTester-${VERSION}.zip" "$package/licenses-EBCTester-${VERSION}.zip"

          printf '%s\n' "-get \"$remote/EBCTester-${VERSION}.bin\" \"$RUNNER_TEMP/existing-ota.bin\"" \
            "-quit" > "$RUNNER_TEMP/preflight.sftp"
          sftp -i "$HOME/.ssh/ota_deploy_key" -oBatchMode=yes -oStrictHostKeyChecking=yes \
            -P "$OTA_SFTP_PORT" -b "$RUNNER_TEMP/preflight.sftp" \
            "$OTA_SFTP_USER@$OTA_SFTP_HOST"
          publish_versioned=true
          if [[ -f "$RUNNER_TEMP/existing-ota.bin" ]]; then
            if ! cmp -s "$image" "$RUNNER_TEMP/existing-ota.bin"; then
              echo "::error::Refusing to overwrite immutable firmware version ${VERSION} with different bytes"
              exit 1
            fi
            publish_versioned=false
          fi

          {
            printf '%s\n' "-mkdir \"$remote/licenses\""
            if [[ "$publish_versioned" == true ]]; then
              printf '%s\n' \
                "put \"$package/EBCTester-${VERSION}.bin\" \"$remote/EBCTester-${VERSION}.bin.uploading\"" \
                "rename \"$remote/EBCTester-${VERSION}.bin.uploading\" \"$remote/EBCTester-${VERSION}.bin\""
            fi
            printf '%s\n' \
            "put \"$package/EBCTester.bin\" \"$remote/EBCTester.bin.uploading\"" \
            "rename \"$remote/EBCTester.bin.uploading\" \"$remote/EBCTester.bin\"" \
            "put \"$package/licenses-EBCTester-${VERSION}.zip\" \"$remote/licenses/licenses-EBCTester-${VERSION}.zip.uploading\"" \
            "rename \"$remote/licenses/licenses-EBCTester-${VERSION}.zip.uploading\" \"$remote/licenses/licenses-EBCTester-${VERSION}.zip\"" \
            "put \"dist/firmware.json\" \"$remote/firmware.json.uploading\"" \
            "rename \"$remote/firmware.json.uploading\" \"$remote/firmware.json\"" \
            "-quit"
          } > "$RUNNER_TEMP/publish.sftp"
          sftp -i "$HOME/.ssh/ota_deploy_key" -oBatchMode=yes -oStrictHostKeyChecking=yes \
            -P "$OTA_SFTP_PORT" -b "$RUNNER_TEMP/publish.sftp" \
            "$OTA_SFTP_USER@$OTA_SFTP_HOST"

          printf '%s\n' "get \"$remote/EBCTester-${VERSION}.bin\" \"$RUNNER_TEMP/published-ota.bin\"" \
            "get \"$remote/firmware.json\" \"$RUNNER_TEMP/published-firmware.json\"" \
            "-quit" > "$RUNNER_TEMP/verify.sftp"
          sftp -i "$HOME/.ssh/ota_deploy_key" -oBatchMode=yes -oStrictHostKeyChecking=yes \
            -P "$OTA_SFTP_PORT" -b "$RUNNER_TEMP/verify.sftp" \
            "$OTA_SFTP_USER@$OTA_SFTP_HOST"
          cmp "$image" "$RUNNER_TEMP/published-ota.bin"
          python - "$RUNNER_TEMP/published-firmware.json" "$VERSION" "$image" <<'PY'
          import hashlib
          import json
          import os
          import sys

          manifest_path, version, image_path = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)
          with open(image_path, "rb") as image_file:
              image = image_file.read()
          expected = {
              "project": "EBCTester",
              "target": "esp32s3",
              "version": version,
              "url": f"https://ebctester.gemelon.de/EBCTester-{version}.bin",
              "size": len(image),
              "sha256": hashlib.sha256(image).hexdigest(),
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Published manifest mismatch for {key}")
          PY
