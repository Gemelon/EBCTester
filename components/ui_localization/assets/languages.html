<section class="card">
  <div class="card-body">
    <h2 class="h4" data-i18n="language.title">Language</h2>
    <p data-i18n="language.help">Select a language in the header. English and German are built in. Additional JSON language files can be uploaded to /languages on the SD card.</p>
    <p class="small text-body-secondary" data-i18n="language.fallback">Missing translations use English. The choice is saved in this browser. Changing language reloads the page, but does not stop a running test.</p>
    <button id="languages-refresh" class="btn btn-outline-primary" type="button" data-i18n="language.refresh">Reload languages</button>
  </div>
</section>
